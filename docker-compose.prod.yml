services:
  app:
    build: .
    container_name: sojalink_app
    ports:
      - "3333:3333"
    env_file:
      - .env.prod
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  worker:
    build: .
    container_name: sojalink_worker
    command: node ace queue:work --queue=pending_events
    env_file:
      - .env.prod
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  database:
    image: mariadb:latest
    container_name: sojalink_db
    env_file:
      - .env.prod
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:latest
    container_name: sojalink_redis
    restart: always

volumes:
  db_data: