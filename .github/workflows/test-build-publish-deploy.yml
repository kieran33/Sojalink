name: Test, build, publish and deploy

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - '.dockerignore'
      - 'docs/**'
      - '.env.example'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sojalink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Copy .env.test
        run: cp .env.test .env

      - name: Run migrations
        run: NODE_ENV=test node ace migration:run --force

      - name: Run tests
        run: node ace test

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sojalink-deployment:latest

  deploy:
    needs: publish
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Railway
        run: |
          npm i -g @railway/cli
          railway redeploy --service sojalink --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}